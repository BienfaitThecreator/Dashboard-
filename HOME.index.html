<body>
    
    <div class="grille">

        <!--sidebar-->
        <aside class="case sidebar"> 

            <div style="display: flex; gap: 22px;">
                <span "><i class="fa-solid fa-arrow-left-long"></i></span>

                <span style="display: flex;gap: 6px;"><i class="fa-solid fa-circle-play"></i><p>Media Player</p></span>
            </div>  <br>

            <!--j'utilise trops les style pask c'es easy to use-->

            <form class="barre-de-recherche">

            </form> <br>

            <!--le menu sidebar-->

            <div class="sidebar-icons">

                <p>0:00:00</p>
                <h1 style="height: 15px; width:15px; border: solid rgb(7, 141, 213);align-items: center; justify-content: center; margin-top: 10px; background: rgb(7, 141, 213); border-radius: 12px; position: relative; left:32px;bottom: 5px;"></h1>
